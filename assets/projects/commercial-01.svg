      <stop offset="0" stop-color="#eef7fb"/><stop offset="1" stop-color="#d2e6f2"/>
    </linearGradient>
    <pattern id="c1grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14303f" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#c1bg)"/>
  <rect width="1200" height="800" fill="url(#c1grid)"/>

  <!-- main tower elevation -->
  <g stroke="#14303f" fill="none">
    <path d="M400 120h420v570H400z" fill="#ffffff" fill-opacity="0.5" stroke-width="2"/>
    <path d="M400 210h420M400 300h420M400 390h420M400 480h420M400 570h420" stroke-opacity="0.45"/>
