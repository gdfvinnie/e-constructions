  <!-- ultraviolet facade slice -->
  <g>
    <path d="M820 120h-60v570h60" fill="#5b16c9" fill-opacity="0.08" stroke="#5b16c9"/>
    <path d="M760 120L700 90M820 120l60-30" stroke="#5b16c9"/>
    <path d="M1010 120v-70M1010 50h100" stroke="#102a38" stroke-opacity="0.35"/>
