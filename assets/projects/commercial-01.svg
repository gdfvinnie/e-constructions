      <path d="M470 120v570M540 120v570M610 120v570M680 120v570M750 120v570"/>
    </g>
    <g fill="#14303f" fill-opacity="0.07" stroke="none">
      <rect x="475" y="220" width="60" height="70"/><rect x="545" y="220" width="60" height="70"/>
      <rect x="685" y="310" width="60" height="70"/><rect x="615" y="400" width="60" height="70"/>
      <rect x="475" y="490" width="60" height="70"/><rect x="755" y="220" width="60" height="70"/>
    </g>
    <!-- crown / mechanical -->
    <path d="M430 120V82h360v38M460 82V56h300v26M520 56V32h180v24" stroke-opacity="0.55"/>
    <!-- podium -->
    <path d="M330 690h560v-80H330z" fill="#ffffff" fill-opacity="0.35"/>
    <path d="M330 610h560M370 690v-80M450 690v-80M530 690v-80M950 690v-80M870 690v-80M790 690v-80M710 690v-80" stroke-opacity="0.32"/>
    <path d="M250 690h700" stroke-opacity="0.5"/>
  </g>

  <!-- adjacent low volumes -->
  <g stroke="#14303f" fill="none" stroke-opacity="0.4">
    <path d="M130 690V450h170v240M130 530h170M130 610h170M180 450v240M250 450v240"/>
    <path d="M960 690V510h150v180M960 590h150M1020 510v180"/>
