<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" width="2000" height="1400" aria-hidden="true">
  <defs>
    <linearGradient id="v-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a23"/>
      <stop offset="0.55" stop-color="#16303c"/>
      <stop offset="1" stop-color="#0a151b"/>
    </linearGradient>
    <linearGradient id="v-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9ebf5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9ebf5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d9ebf5" stop-opacity="0"/>
    </linearGradient>
    <filter id="v-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="2000" height="1400" fill="url(#v-bg)"/>

  <!-- layered perspective frames receding -->
  <g fill="none" stroke="#d9ebf5">
    <g stroke-opacity="0.12">
      <path d="M640 1090V410l760-230v680z"/>
      <path d="M730 1090V470l580-176v596z"/>
      <path d="M820 1090V530l400-121v521z"/>
    </g>
    <g stroke-opacity="0.26">
      <path d="M910 1090V590l220-67v507z"/>
    </g>
    <g stroke-opacity="0.55">
      <path d="M1000 1090V650l40-12v452z" stroke-width="2"/>
    </g>
  </g>

  <!-- vault arcs -->
  <g fill="none" stroke="#d9ebf5">
    <path d="M300 1090C300 640 640 360 1020 360s720 280 720 730" stroke-opacity="0.42" stroke-width="2"/>
    <path d="M420 1090c0-370 270-600 600-600s600 230 600 600" stroke-opacity="0.3"/>
    <path d="M540 1090c0-300 214-490 480-490s480 190 480 490" stroke-opacity="0.2"/>
    <path d="M660 1090c0-230 160-380 360-380s360 150 360 380" stroke-opacity="0.12"/>
    <path d="M1020 360v730" stroke-opacity="0.2" stroke-dasharray="3 12"/>
  </g>

  <!-- ultraviolet sight lines -->
  <g stroke="#8b5cff" stroke-width="2">
    <path d="M120 940L1020 560l880 260" fill="none" opacity="0.75"/>
    <path d="M1020 560L780 1090M1020 560l300 530" opacity="0.4" stroke-dasharray="6 10"/>
    <circle cx="1020" cy="560" r="6" fill="#8b5cff" stroke="none"/>
  </g>
  <g fill="#8b5cff" font-family="ui-monospace, monospace" font-size="20" letter-spacing="3">
    <text x="1040" y="552">OCCULUS 01</text>
    <text x="1420" y="792">SIGHT LINE</text>
  </g>

  <!-- floor datum lines -->
  <g stroke="#d9ebf5" stroke-opacity="0.18">
    <path d="M120 1090h1800M120 980h1800M120 870h1800"/>
  </g>
  <rect x="120" y="790" width="1800" height="300" fill="url(#v-sweep)" opacity="0.3"/>

  <!-- horizon and ground -->
  <path d="M0 1090h2000v310H0z" fill="#081116"/>
  <g stroke="#d9ebf5" stroke-opacity="0.16">
    <path d="M0 1090h2000M0 1138h2000M0 1210h2000"/>
  </g>
  <g fill="#d9ebf5" opacity="0.25" font-family="ui-monospace, monospace" font-size="18" letter-spacing="3">
    <text x="120" y="1340">SPATIAL STUDY — NOT A PROJECT PHOTOGRAPH</text>
    <text x="1710" y="1340">PANEL 03</text>
  </g>
  <rect width="2000" height="1400" filter="url(#v-grain)" opacity="0.6"/>
</svg>
