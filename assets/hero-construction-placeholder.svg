<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" width="2000" height="1400" role="img" aria-labelledby="heroArtTitle heroArtDesc">
  <title id="heroArtTitle">Placeholder monochrome architectural illustration</title>
  <desc id="heroArtDesc">Line artwork of a high-rise building under construction with two tower cranes, standing in for the supplied construction photograph.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1218"/>
      <stop offset="0.55" stop-color="#12212a"/>
      <stop offset="1" stop-color="#22343e"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9ebf5" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#b9d2df" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#b9d2df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="towerA" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#1a2931"/>
      <stop offset="1" stop-color="#31454f"/>
    </linearGradient>
    <linearGradient id="towerB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31454f"/>
      <stop offset="1" stop-color="#1e2e37"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1a21"/>
      <stop offset="1" stop-color="#070d11"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#d9ebf5" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>
    <g id="craneHook">
