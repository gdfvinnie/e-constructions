<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400" aria-hidden="true">
  <defs>
    <pattern id="a-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#102a38" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="a-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#102a38" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4fa"/>
      <stop offset="1" stop-color="#d5e8f3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1400" fill="url(#a-bg)"/>
  <rect width="1200" height="1400" fill="url(#a-grid)"/>

  <!-- axonometric frame -->
  <g stroke="#102a38" fill="none">
    <path d="M250 760l350-205 350 205-350 205z" stroke-width="2" stroke-opacity="0.75"/>
    <path d="M250 760v330l350 205V965M950 760v330l-350 205" stroke-opacity="0.45"/>
    <path d="M250 1090l350-205 350 205M600 965v330" stroke-opacity="0.45"/>
    <path d="M600 555v320" stroke-opacity="0.3"/>
  </g>

  <!-- plan overlay -->
  <g stroke="#102a38" stroke-opacity="0.55" fill="none">
    <path d="M340 790h220v110H340zM560 790v110M450 790v110" stroke-width="2"/>
    <path d="M640 800h180v90H640zM730 800v90" />
    <path d="M340 900h480"/>
  </g>
  <rect x="640" y="800" width="90" height="90" fill="url(#a-hatch)"/>

  <!-- suspended slab -->
  <g>
    <path d="M600 340l330 195-330 195-330-195z" fill="#ffffff" fill-opacity="0.45" stroke="#102a38" stroke-opacity="0.4"/>
    <path d="M600 340v-90M930 535v-60M270 535v-60" stroke="#5b16c9" stroke-width="2"/>
    <path d="M300 390h600" stroke="#5b16c9" stroke-dasharray="4 8"/>
  </g>

  <!-- dimension lines -->
  <g stroke="#5b16c9" fill="none" stroke-width="1.5">
    <path d="M210 700v450M198 700h24M198 1150h24"/>
    <path d="M160 700h970M160 1080h970M1140 700v380"/>
    <path d="M340 1210h520M340 1198v24M860 1198v24"/>
  </g>
  <g fill="#5b16c9" font-family="ui-monospace, monospace" font-size="17" letter-spacing="2">
    <text x="870" y="1244">24.0 M</text>
    <text x="152" y="920" transform="rotate(-90 152 920)">18.0 M</text>
    <text x="590" y="300">LEVEL 02</text>
  </g>
  <g fill="#102a38" fill-opacity="0.6" font-family="ui-monospace, monospace" font-size="15" letter-spacing="2">
    <text x="250" y="1300">STRUCTURAL / PLAN STUDY</text>
    <text x="930" y="1300">SHEET A-104</text>
  </g>
  <path d="M250 1330h700" stroke="#102a38" stroke-opacity="0.18"/>
</svg>
